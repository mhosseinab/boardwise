# BoardWise web image nginx server block (S20). Replaces the stock
# nginx:alpine /etc/nginx/conf.d/default.conf.
#
# Serves the built Vite/React SPA on :3006 and reverse-proxies `/api/...` to
# the `api` compose service on 8006 (decision §4.11: the SPA only ever calls
# relative `/api/...` paths — this is the production-mode analogue of the
# Vite dev-server proxy in frontend/vite.config.ts).

server {
    listen 3006;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
